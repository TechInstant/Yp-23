# Render Blueprint — deploy with "New +" -> "Blueprint" and point at this repo.
# This is a pure client-side app (Firebase is the backend), so a Static Site is
# all that is needed. No server, no cold starts, free tier is enough.
services:
  - type: web
    name: rccg-yp23-attendance
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      # Set the real values in the Render dashboard (Environment tab) or here.
      # These are Firebase *client* config values — they are public by design and
      # safe to ship in the bundle. Data is protected by firestore.rules, not by
      # hiding these keys.
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # SPA fallback so /admin/dashboard etc. resolve on a hard refresh.
      - type: rewrite
        source: /*
        destination: /index.html
