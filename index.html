<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The official RCCG seal. Listed after the SVG so it wins where both are
      understood; the SVG stays as a fallback for anything that cannot take a
      PNG icon.

      Note the seal carries fine lettering around its ring, which will not be
      legible at 16px in a browser tab. The dove and the colours still read,
      and it is unmistakably the church's mark, which is what a favicon is for.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="448x448" href="/rccg-logo.png" />
    <link rel="apple-touch-icon" href="/rccg-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16225A" />
    <meta
      name="description"
      content="RCCG Youth Province 23 - parish directory and weekly Sunday service attendance returns."
    />
    <title>RCCG Youth Province 23 — Attendance Portal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
