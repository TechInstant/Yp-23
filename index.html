<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The official RCCG seal, and the only icon declared.

      There was a hand-drawn SVG here as well. That was a mistake: a browser
      that understands SVG icons prefers them over PNG whatever the order, so
      the placeholder was overriding the real seal rather than backing it up.
    -->
    <link rel="icon" type="image/png" href="/rccg-logo.png" />
    <link rel="apple-touch-icon" href="/rccg-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16225A" />
    <meta
      name="description"
      content="RCCG Youth Province 23 - parish directory and weekly Sunday service attendance returns."
    />
    <title>RCCG Youth Province 23 — Attendance Portal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
